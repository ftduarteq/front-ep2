# Define un bloque de servidor virtual en Nginx
server {
    # Instruye a Nginx para que escuche el tráfico entrante en el puerto 8080.
    # (Se usa 8080 en lugar de 80 porque el contenedor corre como usuario no-root)
    listen 8080;
    
    # Captura todas las peticiones sin importar qué dominio se haya usado (comodín)
    server_name _;
    
    # Define la codificación de caracteres por defecto para las respuestas HTTP
    charset utf-8;

    # Especifica el directorio raíz donde Nginx buscará los archivos a servir
    root /usr/share/nginx/html;
    
    # Especifica el archivo por defecto que se servirá si se solicita un directorio
    index index.html;

    # Bloque para manejar las peticiones a la ruta raíz (archivos estáticos del frontend)
    location / {
        # Intenta servir el archivo exacto ($uri), si no existe intenta como directorio ($uri/), 
        # y si no existe ninguno de los dos, sirve el index.html (útil para Single Page Applications)
        try_files $uri $uri/ /index.html;
    }

    # El ruteo de /api/ ahora es manejado por el Application Load Balancer de AWS
}
